<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#041f29" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="description" content="Ride through a 3D Web3 learning world, dodge obstacles, grab boosts and tokens, and reach KitLab." />
  <title>Ride to KitLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style></style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="hit"></div>

<div id="hud" class="hide">
  <div id="quest" class="panel">
    <div id="qrow"><span id="qmode">NEON SPRINT</span><span id="qtime">0:00</span></div>
    <div id="qobj">
      <svg id="qarrow" viewBox="0 0 24 24"><path d="M12 2 L20 20 L12 15 L4 20 Z" fill="#19d3ea"/></svg>
      <span id="qtxt">Follow the road</span>
    </div>
    <div id="qscore"><b id="qsc">0</b><span id="qcombo"></span><span id="qcoin"></span></div>
  </div>
  <div id="tr">
    <button id="status" class="panel" aria-label="Show riders"><i class="dot" id="sdot"></i><span id="sTxt">Connecting</span></button>
    <canvas id="mini" width="168" height="236"></canvas>
    <div id="btnrow">
      <button class="sbtn" id="bCam">View</button>
      <button class="sbtn" id="bSnd">Sound on</button>
      <button class="sbtn" id="bPause">Pause</button>
      <button class="sbtn" id="bBack">Back to road</button>
    </div>
  </div>
  <div id="roster" class="panel hide"></div>
  <div id="speedo"><div id="spdTxt">0 km/h</div><div id="stam"><i id="stamI"></i></div></div>
  <div id="toast" class="panel"></div>
  <div id="pop"></div>
  <div id="count" class="hide"></div>
  <div id="touch">
    <div id="padZone"></div>
    <div id="pad" class="panel"><i id="knob"></i></div>
    <button class="tb" id="tBrake">Brake</button>
    <button class="tb" id="tBoost">Boost</button>
    <button class="tb" id="tBell">Bell</button>
    <button class="tb" id="tJump">Jump</button>
    <button class="tb" id="tTrick" aria-label="Perform a stunt">Trick</button>
  </div>
</div>

<div id="menu" class="ov">
  <div id="menuCard" class="panel">
    <section id="landingActions">
      <div class="game-kicker"><i></i> KITLAB RIDING EXPERIENCE</div>
      <h1>Ride to <span style="color:var(--portal)">KitLab</span></h1>
      <p class="tagline">Choose your road. Earn your finish.</p>
      <button type="button" id="playBtn" class="btn primary">PLAY</button>
      <p class="menu-foot">5 RIDES <span>•</span> SOLO OR ROOM PLAY</p>
    </section>
    <section id="setupPanel">
      <div id="screenHeading"><h2>SELECT YOUR RIDE</h2><button type="button" id="backToTitle">← BACK</button></div>
      <div id="missionPicker">
        <button type="button" id="pickNeon" class="btn active" data-mission="neon"><b>⚡ NEON SPRINT</b><span>SELECTED</span></button>
        <button type="button" id="pickCoast" class="btn" data-mission="coastline"><b>🌊 COASTLINE RUSH</b><span>AVAILABLE</span></button>
        <button type="button" id="pickDesert" class="btn" data-mission="desert"><b>🏜️ DUST DEVIL</b><span>AVAILABLE</span></button>
        <button type="button" id="pickMountain" class="btn" data-mission="mountain"><b>⛰️ MOUNTAIN PASS</b><span>AVAILABLE</span></button>
        <button type="button" id="pickCity" class="btn" data-mission="city"><b>🌃 CITY LIGHTS</b><span>AVAILABLE</span></button>
      </div>
      <div class="setup-fields">
        <label class="fld"><span>Rider name</span><input id="inName" type="text" maxlength="14" autocomplete="off"></label>
        <label class="fld"><span>Rider style</span><select id="inGender" aria-label="Choose rider style"><option value="male">Male rider</option><option value="female">Female rider</option></select></label>
        <label class="fld"><span>Room <small>Riders in the same room share the road.</small></span><input id="inRoom" type="text" maxlength="16" value="kitlab" autocomplete="off"></label>
        <label class="fld"><span>AI opponents <small>Computer riders join when no people are online.</small></span><select id="inAICount" class="fld-select" aria-label="Choose number of AI opponents"><option value="0">No AI riders</option><option value="1">1 AI rider</option><option value="2">2 AI riders</option><option value="3">3 AI riders</option><option value="4">4 AI riders</option><option value="5" selected>5 AI riders</option></select></label>
      </div>
      <button id="go" class="btn primary" style="width:100%;padding:13px" disabled>Building the world...</button>
      <div id="help"></div>
    </section>
  </div>
</div>

<div id="modal" class="ov hide">
  <div id="mCard" class="panel">
    <div id="mHead"><i id="mGem" style="display:none"></i><div><div id="mTitle"></div><div id="mStep"></div></div></div>
    <p id="mBody"></p>
    <div id="mQ"></div>
    <div id="mOpts"></div>
    <div id="mFb"></div>
    <div id="mBtns"><button class="btn" id="mLater">Not now</button><button class="btn primary hide" id="mTake">Continue</button></div>
  </div>
</div>

<div id="arrive" class="ov hide">
  <div id="aCard" class="panel">
    <h2>Run complete!</h2>
    <p id="aSum"></p>
    <div id="aBoard"></div>
    <div id="aBtns">
      <button class="btn primary hide" id="aNext">Next Mission →</button>
      <button class="btn primary" id="aExplore">Free ride</button>
      <button class="btn hide" id="aOpen">Open Kitlab</button>
      <button class="btn" id="aAgain">Race again</button>
    </div>
  </div>
</div>
<div id="pause" class="ov hide" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
  <div id="pauseCard" class="panel">
    <h2 id="pauseTitle">Ride paused</h2>
    <p>Your ride is on hold. Take a breather, then jump back in.</p>
    <button id="resumeRide" class="btn primary">Resume riding</button>
    <button id="pauseSound" class="btn">Sound on</button>
  </div>
</div>
<div id="flash"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
