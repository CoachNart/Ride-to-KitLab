<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#041f29" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="KitRace is a 3D bike-racing adventure with five unique routes, stunts, boosts, collectibles, solo rides, and room play. Race through neon trails, coastal roads, desert tracks, mountain passes, and city streets." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="KitRace — 3D Bike Racing Adventure" />
  <meta property="og:description" content="Pick your route, hit the road, chain stunts, collect shards, and race through five distinct 3D worlds in KitRace." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="KitRace — 3D Bike Racing Adventure" />
  <meta name="twitter:description" content="A 3D bike-racing adventure featuring five unique routes, stunts, boosts, collectibles, and solo or room play." />
  <title>KitRace — 3D Bike Racing Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style></style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="hit"></div>

<div id="hud" class="hide">
  <div id="quest" class="panel">
    <div id="qrow"><span id="qmode">NEON SPRINT</span><span id="qtime">0:00</span></div>
    <div id="qobj">
      <svg id="qarrow" viewBox="0 0 24 24"><path d="M12 2 L20 20 L12 15 L4 20 Z" fill="#19d3ea"/></svg>
      <span id="qtxt">Follow the road</span>
    </div>
    <div id="qscore"><b id="qsc">0</b><span id="qcombo"></span><span id="qcoin"></span></div>
  </div>
  <div id="tr">
    <button id="status" class="panel" aria-label="Show riders"><i class="dot" id="sdot"></i><span id="sTxt">Connecting</span></button>
    <canvas id="mini" width="168" height="236"></canvas>
    <div id="btnrow">
      <button class="sbtn" id="bCam">View</button>
      <button class="sbtn" id="bSnd">Sound on</button>
      <button class="sbtn" id="bPause">Pause</button>
      <button class="sbtn" id="bBack">Back to road</button>
    </div>
  </div>
  <div id="roster" class="panel hide"></div>
  <div id="speedo"><div id="spdTxt">0 km/h</div><div id="stam"><i id="stamI"></i></div></div>
  <div id="toast" class="panel"></div>
  <div id="pop"></div>
  <div id="count" class="hide"></div>
  <div id="touch">
    <div id="padZone"></div>
    <div id="pad" class="panel"><i id="knob"></i></div>
    <button class="tb" id="tBrake">Brake</button>
    <button class="tb" id="tBoost">Boost</button>
    <button class="tb" id="tBell">Bell</button>
    <button class="tb" id="tJump">Jump</button>
    <button class="tb" id="tTrick" aria-label="Perform a stunt">Trick</button>
  </div>
</div>

<div id="menu" class="ov">
  <div id="menuCard" class="panel">
    <section id="landingActions">
      <div class="game-kicker"><i></i> KITRACE · 3D BIKE RACING</div>
      <h1>Kit<span style="color:var(--portal)">Race</span></h1>
      <p class="tagline">Pick your route. Ride hard. Own the finish.</p>
      <button type="button" id="playBtn" class="btn primary">PLAY</button>
      <p class="menu-foot">5 RIDES <span>•</span> SOLO OR ROOM PLAY</p>
    </section>
    <section id="setupPanel">
      <div id="screenHeading"><h2>SELECT YOUR RIDE</h2><button type="button" id="backToTitle">← BACK</button></div>
      <div id="missionPicker">
        <button type="button" id="pickNeon" class="btn active" data-mission="neon"><b>⚡ NEON SPRINT</b><span>SELECTED</span></button>
        <button type="button" id="pickCoast" class="btn" data-mission="coastline"><b>🌊 COASTLINE RUSH</b><span>AVAILABLE</span></button>
        <button type="button" id="pickDesert" class="btn" data-mission="desert"><b>🏜️ DUST DEVIL</b><span>AVAILABLE</span></button>
        <button type="button" id="pickMountain" class="btn" data-mission="mountain"><b>⛰️ MOUNTAIN PASS</b><span>AVAILABLE</span></button>
        <button type="button" id="pickCity" class="btn" data-mission="city"><b>🌃 CITY LIGHTS</b><span>AVAILABLE</span></button>
      </div>
      <div class="setup-fields">
        <label class="fld"><span>Rider name</span><input id="inName" type="text" maxlength="14" autocomplete="off"></label>
        <label class="fld"><span>Rider style</span><select id="inGender" aria-label="Choose rider style"><option value="male">Male rider</option><option value="female">Female rider</option></select></label>
        <label class="fld"><span>Room <small>Riders in the same room share the road.</small></span><input id="inRoom" type="text" maxlength="16" value="kitlab" autocomplete="off"></label>
        <label class="fld"><span>AI opponents <small>Computer riders join when no people are online.</small></span><select id="inAICount" class="fld-select" aria-label="Choose number of AI opponents"><option value="0">No AI riders</option><option value="1">1 AI rider</option><option value="2">2 AI riders</option><option value="3">3 AI riders</option><option value="4">4 AI riders</option><option value="5" selected>5 AI riders</option></select></label>
      </div>
      <button id="go" class="btn primary" style="width:100%;padding:13px" disabled>Building the world...</button>
      <div id="help"></div>
    </section>
  </div>
</div>

<div id="modal" class="ov hide">
  <div id="mCard" class="panel">
    <div id="mHead"><i id="mGem" style="display:none"></i><div><div id="mTitle"></div><div id="mStep"></div></div></div>
    <p id="mBody"></p>
    <div id="mQ"></div>
    <div id="mOpts"></div>
    <div id="mFb"></div>
    <div id="mBtns"><button class="btn" id="mLater">Not now</button><button class="btn primary hide" id="mTake">Continue</button></div>
  </div>
</div>

<div id="arrive" class="ov hide">
  <div id="aCard" class="panel">
    <h2>Run complete!</h2>
    <p id="aSum"></p>
    <div id="aBoard"></div>
    <div id="aBtns">
      <button class="btn primary hide" id="aNext">Next Mission →</button>
      <button class="btn primary" id="aExplore">Free ride</button>
      <button class="btn hide" id="aOpen">Open KitLab</button>
      <button class="btn" id="aAgain">Race again</button>
    </div>
  </div>
</div>
<div id="pause" class="ov hide" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
  <div id="pauseCard" class="panel">
    <h2 id="pauseTitle">Ride paused</h2>
    <p>Your ride is on hold. Take a breather, then jump back in.</p>
    <button id="resumeRide" class="btn primary">Resume riding</button>
    <button id="pauseSound" class="btn">Sound on</button>
  </div>
</div>
<div id="flash"></div>
  <script>
    // Catch failures that happen while loading the game module itself (before its own handlers can run).
    window.__kitRaceBooted = false;
    window.__kitRaceUiWired = false;
    // Independent menu fallback: basic navigation must still work if the game module throws before wiring.
    document.addEventListener('click', function (event) {
      if (window.__kitRaceUiWired) return;
      var button = event.target && event.target.closest ? event.target.closest('button') : null;
      if (!button) return;
      if (button.id === 'playBtn') {
        event.preventDefault();
        document.getElementById('landingActions').classList.add('hide');
        document.getElementById('setupPanel').classList.add('show');
      } else if (button.id === 'backToTitle') {
        event.preventDefault();
        document.getElementById('landingActions').classList.remove('hide');
        document.getElementById('setupPanel').classList.remove('show');
      } else if (button.matches('[data-mission]')) {
        event.preventDefault();
        var mission = button.getAttribute('data-mission');
        window.location.href = window.location.pathname + '?mission=' + encodeURIComponent(mission) + '&screen=missions';
      } else if (button.id === 'go') {
        event.preventDefault();
        var message = document.getElementById('kitRaceStartupMessage');
        if (message) message.textContent = 'The game engine did not finish loading, so riding cannot start. Reload the page; if this repeats, send the displayed startup error.';
        var panel = document.getElementById('kitRaceStartupFailure');
        if (!panel) {
          panel = document.createElement('div');
          panel.id = 'kitRaceStartupFailure';
          panel.style.cssText = 'position:fixed;z-index:2147483647;inset:12px;padding:16px;border:1px solid #ff5a67;border-radius:14px;background:#071d26;color:#f1fbfd;font:14px/1.5 system-ui,sans-serif;pointer-events:auto';
          panel.innerHTML = '<strong>KitRace engine did not load</strong><p id="kitRaceStartupMessage">Reload the page and try again.</p><button id="kitRaceStartupReload" type="button">Reload game</button>';
          document.body.appendChild(panel);
          panel.querySelector('#kitRaceStartupReload').addEventListener('click', function(){ window.location.reload(); });
        }
      }
    }, true);
    window.addEventListener('error', function (event) {
      if (window.__kitRaceBooted) return;
      var panel = document.getElementById('kitRaceStartupFailure');
      if (!panel) {
        panel = document.createElement('div');
        panel.id = 'kitRaceStartupFailure';
        panel.style.cssText = 'position:fixed;z-index:2147483647;inset:12px 12px auto;padding:16px;border:1px solid #ff5a67;border-radius:14px;background:#071d26;color:#f1fbfd;font:14px/1.5 system-ui,sans-serif;box-shadow:0 8px 30px #0008;pointer-events:auto';
        panel.innerHTML = '<strong style="display:block;font-size:16px;margin-bottom:5px">KitRace could not finish starting</strong><span id="kitRaceStartupMessage">A startup error stopped the game from loading. Reload to try again.</span><button type="button" id="kitRaceStartupReload" style="display:block;margin-top:12px;padding:9px 14px;border:0;border-radius:9px;background:#19d3ea;color:#02222a;font-weight:800">Reload game</button>';
        document.body.appendChild(panel);
        panel.querySelector('#kitRaceStartupReload').addEventListener('click', function () { window.location.reload(); });
      }
      var message = panel.querySelector('#kitRaceStartupMessage');
      if (message && event.message) message.textContent = ('Startup error: ' + event.message).slice(0, 220);
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
